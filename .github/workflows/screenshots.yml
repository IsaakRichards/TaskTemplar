name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/screenshots.py
      - .github/workflows/screenshots.yml

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb install -r app/build/outputs/apk/debug/app-debug.apk && python3 tools/screenshots.py

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      - name: Publish to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git add -A
          git -c user.name="TaskTemplar CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
