name: One-time cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the old screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/screenshots" || echo "already gone"
